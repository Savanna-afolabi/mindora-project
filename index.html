<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindora</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Mindora</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-md">
      <div class="container-lg">
        <a class="navbar-brand d-md-none" href="#">
          <img src="assets/image 491.png" alt="" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse d-lg-flex justify-content-between"
          id="navbarSupportedContent"
        >
          <a class="navbar-brand d-none d-md-block">
            <img src="assets/image 491.png" alt="" />
          </a>

          <div class="d-flex">
            <ul
              class="navbar-nav me-auto mb-2 mb-lg-0 justify-content-between gap-lg-5 gap-3 d-flex"
            >
              <li>About</li>
              <li>How It Works</li>
              <li>resources</li>
              <li>privacy</li>
            </ul>
          </div>

          <button class="chatting-btn">Start chatting</button>
        </div>
      </div>
    </nav>
    <!-- main -->
    <main>
      <!-- section-1 -->
      <section class="section-1">
        <!-- main-div -->
        <div class="container-lg  section-1-div" >
          <!-- section-1 div-1  -->
          <div class="text-div">
            <button> <img src="assets/Ellipse 2241.png"> Available 24/7</button>
            <h1 >Safe support whenever you need someone to talk to.</h1>
            <p>
              Chat anonymously with Mindora for guidance, emotional support, and
              health-related conversations — without judgment, without sign-ups.
            </p>
            <button>Start anonymous Chat</button>
          </div>
          <!-- section-1 div-2 -->
          <div class="img-div ">
            <img src="assets/Frame 2121454976.png" alt="hero-img" class="img-fluid"/>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
